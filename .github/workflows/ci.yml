name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on ${{ matrix.os }} (Node 24)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm pack --dry-run

  integration:
    name: Real gopls and Lumine integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LUMINE_JASMINE_REPORTER: list
      GOPLS_VERSION: 0.23.0
      REQUIRE_GOPLS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          path: ide-go
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/lumine
          path: lumine
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/ide-client
          path: ide-client
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/language-go
          path: language-go
      - uses: actions/setup-node@v7
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: false
      - name: Install the exact authenticated gopls release
        run: |
          go install golang.org/x/tools/gopls@v${GOPLS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Use HTTPS for public Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install adapter dependencies
        working-directory: ide-go
        run: npm ci --ignore-scripts
      - name: Install client dependencies
        working-directory: ide-client
        run: npm ci --ignore-scripts
      - name: Install editor dependencies
        working-directory: lumine
        run: |
          install() { npm ci --ignore-scripts; }
          install || install || install
      - name: Prepare Electron
        working-directory: lumine
        run: |
          node node_modules/electron/install.js
          npm run build
      - name: Link editor service packages
        run: |
          mkdir -p "$HOME/.lumine/packages-dev"
          ln -s "$GITHUB_WORKSPACE/ide-client" "$HOME/.lumine/packages-dev/ide-client"
          ln -s "$GITHUB_WORKSPACE/language-go" "$HOME/.lumine/packages-dev/language-go"
      - name: Run Jasmine 6 against the real editor and server
        working-directory: lumine
        timeout-minutes: 20
        run: xvfb-run --auto-servernum npm start -- --dev --test ../ide-go/spec
